name: Refresh topic caches

on:
  schedule:
    - cron: "17 3 * * *"
    - cron: "41 4 1 * *"
  workflow_dispatch:
    inputs:
      job:
        description: Which cache to refresh
        type: choice
        options:
          - topics
          - vocabulary
        default: topics

permissions:
  contents: write

concurrency:
  group: refresh-topics
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event.schedule == '17 3 * * *' || inputs.job == 'topics'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Refresh caches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run compass refresh --max-topics 8
      - name: Commit refreshed caches
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No cache changes to commit"
            exit 0
          fi

          git commit -m "chore: refresh topic caches"
          git push

  vocabulary:
    if: github.event.schedule == '41 4 1 * *' || inputs.job == 'vocabulary'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
      - run: uv sync --locked --extra clusters
      - uses: actions/cache@v6
        with:
          path: .cache/models
          key: potion-base-8M-bf8b056651a2c21b8d2565580b8569da283cab23
      - name: Refresh vocabulary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run compass vocabulary
      - name: Rebuild tag clusters
        run: uv run compass clusters
      - name: Commit refreshed vocabulary and clusters
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vocabulary.json clusters.json

          if git diff --cached --quiet; then
            echo "No vocabulary changes to commit"
            exit 0
          fi

          git commit -m "chore: refresh topic vocabulary and clusters"
          git push
